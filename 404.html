<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — The Holy Drop</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: #fbf7ef; color: #1d2a2e; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 2.6rem; color: #082e37; margin: 16px 0 8px; }
    p { color: #5a676b; margin: 0 0 24px; }
    a { display: inline-block; background: #d9742b; color: #fff; text-decoration: none; font-weight: 600; padding: 12px 24px; border-radius: 999px; }
    a:hover { background: #bd5f1c; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" width="56" height="56" aria-hidden="true" style="margin:0 auto"><path d="M16 2.5C11.2 9.2 6 14.6 6 20.2a10 10 0 0 0 20 0C26 14.6 20.8 9.2 16 2.5z" fill="#0f5161"/><path d="M9.6 21.2c2.1-1.5 4.3-1.5 6.4 0s4.3 1.5 6.4 0" stroke="#f1b434" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <h1>Page not found</h1>
    <p>The page you’re looking for has drifted downstream.</p>
    <a id="home-link" href="./">Back to The Holy Drop</a>
  </main>
  <script>
    // On GitHub Pages project sites the store lives under /<repo>/.
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      if (/\.github\.io$/.test(location.hostname) && parts.length) {
        document.getElementById('home-link').href = '/' + parts[0] + '/';
      } else {
        document.getElementById('home-link').href = '/';
      }
    })();
  </script>
</body>
</html>
